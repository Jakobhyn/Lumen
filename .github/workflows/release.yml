name: Release

# Push a tag matching the version in skin.json (e.g. v0.2.0) to publish
# a release with Lumen.zip, ready to unpack into Steam/millennium/themes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check (tag must match skin.json version)
        run: node tools/check.js --tag "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - name: Build Lumen.zip
        run: |
          mkdir -p build/Lumen
          git archive HEAD | tar -x -C build/Lumen
          cd build/Lumen
          rm -rf tools test .github .gitignore .gitattributes .stylelintrc.json eslint.config.js package.json package-lock.json
          cd ../..
          (cd build && zip -qr ../Lumen.zip Lumen)
          unzip -l Lumen.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" Lumen.zip --title "Lumen ${GITHUB_REF_NAME}" --generate-notes
